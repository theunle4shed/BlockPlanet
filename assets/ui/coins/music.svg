<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
<defs>
<filter id="emboss" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="h"/>
  <feGaussianBlur in="h" stdDeviation="0.9" result="hb"/>
  <feDiffuseLighting in="hb" surfaceScale="5" diffuseConstant="1.05" lighting-color="#ffffff" result="lit">
    <feDistantLight azimuth="225" elevation="52"/>
  </feDiffuseLighting>
  <feComposite in="lit" in2="SourceAlpha" operator="in"/>
</filter>
</defs>
<g filter="url(#emboss)">
<circle cx="50" cy="50" r="48" fill="#ffffff"/>
<circle cx="50" cy="50" r="41.5" fill="#3a3a3a"/>
<circle cx="50" cy="50" r="40" fill="#808080"/>
<path d="M36 30 L70 22 V60" stroke="#ffffff" stroke-width="5" fill="none" stroke-linejoin="round"/>
<path d="M36 30 V66" stroke="#ffffff" stroke-width="5"/>
<ellipse cx="30" cy="67" rx="8" ry="6" fill="#ffffff" transform="rotate(-20 30 67)"/>
<ellipse cx="64" cy="61" rx="8" ry="6" fill="#ffffff" transform="rotate(-20 64 61)"/>
<path d="M36 38 L70 30" stroke="#ffffff" stroke-width="5"/>
</g>
</svg>